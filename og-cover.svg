<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="630"
     viewBox="0 0 1200 630">

    <!-- Фон: градиент сине-фиолетовый -->
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#7c3aed"/>
        </linearGradient>
        <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="rgba(255,255,255,0.98)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0.92)"/>
        </linearGradient>
    </defs>

    <!-- Фон -->
    <rect width="1200" height="630" fill="url(#bg)"/>

    <!-- Декоративные круги -->
    <circle cx="1050" cy="120" r="180" fill="rgba(255,255,255,0.08)"/>
    <circle cx="150" cy="560" r="220" fill="rgba(255,255,255,0.06)"/>
    <circle cx="900" cy="560" r="120" fill="rgba(255,255,255,0.05)"/>

    <!-- Белая карточка -->
    <rect x="80" y="90" width="1040" height="450"
          rx="32" ry="32" fill="url(#card)"/>

    <!-- Логотип (кубик) -->
    <g transform="translate(140, 150)">
        <rect width="90" height="90" rx="20" fill="#2563eb"/>
        <path d="M 25 30 L 65 30 L 65 60 L 25 60 Z"
              fill="none" stroke="white" stroke-width="5"
              stroke-linejoin="round"/>
        <path d="M 25 30 L 45 15 L 65 30"
              fill="none" stroke="white" stroke-width="5"
              stroke-linejoin="round"/>
        <path d="M 65 30 L 65 60 L 45 75 L 25 60"
              fill="none" stroke="white" stroke-width="5"
              stroke-linejoin="round"/>
        <path d="M 45 15 L 45 45 M 45 45 L 65 60 M 45 45 L 25 60"
              fill="none" stroke="white" stroke-width="5"
              stroke-linejoin="round" opacity="0.7"/>
    </g>

    <!-- Название сайта -->
    <text x="260" y="205"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="52" font-weight="800" fill="#0f172a">
        MyFiles
    </text>

    <!-- Подзаголовок -->
    <text x="140" y="300"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="34" font-weight="700" fill="#0f172a">
        Библиотека бесплатных файлов
    </text>

    <text x="140" y="350"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="22" font-weight="400" fill="#475569">
        Программы · Книги · Музыка · Игры · Фильмы
    </text>

    <text x="140" y="390"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="18" font-weight="400" fill="#64748b">
        Прямые ссылки на облако без регистрации для просмотра каталога
    </text>

    <!-- Нижняя плашка -->
    <rect x="140" y="440" width="280" height="50"
          rx="25" ry="25" fill="#2563eb"/>
    <text x="280" y="472"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="18" font-weight="700" fill="white"
          text-anchor="middle">
        dimonmaxx.github.io
    </text>

    <!-- Бейдж "бесплатно" -->
    <rect x="440" y="440" width="180" height="50"
          rx="25" ry="25" fill="#f59e0b"/>
    <text x="530" y="472"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="18" font-weight="700" fill="white"
          text-anchor="middle">
        100% бесплатно
    </text>

</svg>
