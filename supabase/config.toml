# ============================================================
# supabase/config.toml — конфигурация проекта для Supabase CLI
# ============================================================
# Этот файл нужен CLI, чтобы знать, к какому проекту подключаться
# и как деплоить функции. Он не влияет на прод-базу и не заменяет
# секреты (SUPABASE_ACCESS_TOKEN, SERVICE_ROLE_KEY и т.д.).
#
# Если меняешь verify_jwt у функции — меняй здесь, потом push:
# workflow Deploy Supabase Functions задеплоит новые настройки.
# ============================================================

project_id = "rmoonebbvpmvthvpcmpt"

# ─── Локальные сервисы (для разработки, на CI не используются) ───
# Значения — дефолтные из supabase init. На деплой функций не влияют.

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# ─── Edge Functions: настройки verify_jwt ───
# verify_jwt = true  — Edge Function проверяет JWT перед выполнением.
#                      Анонимные вызовы отклоняются с 401.
# verify_jwt = false — функция доступна всем (включая анонимных).
#
# Внутри самой функции всё равно может быть проверка роли —
# это независимый уровень.

# Публичные функции (скачивание, форма submit):
[functions.yandex-download]
verify_jwt = false

[functions.terabox-download]
verify_jwt = false

[functions.submit-form]
verify_jwt = false

# Админские функции (требуют JWT пользователя, внутри проверяется роль):
[functions.github-dispatch]
verify_jwt = true

[functions.admin-delete-user]
verify_jwt = true
