name: Sync content from cloud

on:
  workflow_dispatch:
    inputs:
      sections:
        description: 'Разделы через запятую (пусто = все). Например: programs'
        required: false
        default: ''
        type: string
      run_yandex:
        description: 'Синхронизировать Яндекс.Диск'
        required: false
        default: true
        type: boolean
      run_terabox:
        description: 'Синхронизировать TeraBox'
        required: false
        default: true
        type: boolean
      skip_enrichment:
        description: 'Пропустить обогащение из внешних API (для книг)'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

concurrency:
  group: sync-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ─── Playwright нужен только для TeraBox ───
      - name: Install Playwright Chromium
        if: github.event.inputs.run_terabox != 'false'
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      # ─── Кэш обогащения ───
      - name: Restore enrichment cache
        uses: actions/cache@v4
        with:
          path: _cache
          key: enrichment-${{ github.ref }}-${{ hashFiles('_content/*.json') }}
          restore-keys: |
            enrichment-${{ github.ref }}-
            enrichment-

      - name: Ensure cache dir exists
        run: mkdir -p _cache

      - name: Create credentials.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      # ─── Яндекс.Диск ───
      - name: Run yandex_disk_sync.py
        if: github.event.inputs.run_yandex != 'false'
        env:
          GOOGLE_CREDENTIALS_JSON:   ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          YADISK_TOKEN:              ${{ secrets.YADISK_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_BOOKS_API_KEY:      ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          SPREADSHEET_NAME:          "НаполнениеСайта"
          SPREADSHEET_ID:            ${{ secrets.SPREADSHEET_ID }}
          WIKI_LANG:                 "ru"
          ENABLE_LLM_FALLBACK:       "0"
          PRESERVE_USER_EDITS:       "1"
          BACKUP_BEFORE_SYNC:        "1"
          BACKUP_KEEP_COUNT:         "3"
          SYNC_SECTIONS:             ${{ github.event.inputs.sections || '' }}
          SKIP_ENRICHMENT:           ${{ github.event.inputs.skip_enrichment == 'true' && '1' || '0' }}
        run: python yandex_disk_sync.py

      # ─── TeraBox ───
      - name: Run terabox_sync.py
        if: github.event.inputs.run_terabox != 'false'
        env:
          GOOGLE_CREDENTIALS_JSON:   ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SPREADSHEET_NAME:          "НаполнениеСайта"
          SPREADSHEET_ID:            ${{ secrets.SPREADSHEET_ID }}
          PRESERVE_USER_EDITS:       "1"
          BACKUP_BEFORE_SYNC:        "1"
          BACKUP_KEEP_COUNT:         "3"
          SYNC_SECTIONS:             ${{ github.event.inputs.sections || '' }}
          TERABOX_COOKIE:            ${{ secrets.TERABOX_COOKIE }}
        run: python terabox_sync.py

      # ─── Генерация JSON ───
      - name: Run generate_from_sheets.py
        env:
          GOOGLE_CREDENTIALS_JSON:   ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID:            ${{ secrets.SPREADSHEET_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_SECTIONS:             ${{ github.event.inputs.sections || '' }}
        run: python generate_from_sheets.py

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add _content/ || true
          if [ -d _cache ]; then
            git add _cache/ || true
          fi

          if git diff --staged --quiet; then
            echo "Нет изменений для коммита."
            exit 0
          fi

          git commit -m "Auto-sync content $(date -u +'%Y-%m-%d %H:%M UTC')"

          git pull --rebase origin main || {
            echo "Rebase conflict — оставляем свежую генерацию"
            git checkout --theirs _content/ 2>/dev/null || true
            git add _content/ || true
            GIT_EDITOR=true git rebase --continue || git rebase --skip || true
          }

          git push
