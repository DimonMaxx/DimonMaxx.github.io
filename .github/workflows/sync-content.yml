name: Sync content (releases → sheets → json)

# ────────────────────────────────────────────────────────────
# Триггеры:
#   • schedule  — раз в сутки в 03:00 UTC
#   • workflow_dispatch — вручную из GitHub UI или из админки
# ────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим работы'
        required: false
        default: 'Полная синхронизация (GitHub + Sheets + JSON)'
        type: choice
        options:
          - 'Полная синхронизация (GitHub + Sheets + JSON)'
          - 'Только GitHub -> Google Sheets (Сбор файлов)'
          - 'Только Google Sheets -> JSON (Обновление сайта)'
          - 'Только отчет (Ничего не менять)'
      dry_run:
        description: 'Dry-run (не писать в Sheets/JSON, только отчёт)'
        required: false
        default: false
        type: boolean
      
      # ─── Чекбоксы для выбора разделов ───
      sync_books:
        description: '📚 Книги'
        type: boolean
        default: true
      sync_programs:
        description: '💻 Программы'
        type: boolean
        default: true
      sync_music:
        description: '🎵 Музыка'
        type: boolean
        default: true
      sync_games:
        description: '🎮 Игры'
        type: boolean
        default: true
      sync_movies:
        description: '🎬 Фильмы'
        type: boolean
        default: true
      sync_misc:
        description: '📁 Разное'
        type: boolean
        default: true
      sync_articles:
        description: '📝 Статьи'
        type: boolean
        default: true
      sync_news:
        description: '📰 Новости'
        type: boolean
        default: true
  schedule:
    # Раз в сутки в 03:00 UTC
    - cron: '0 3 * * *'

permissions:
  contents: write

concurrency:
  group: sync-content
  cancel-in-progress: false

jobs:
  sync-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ─── 1. Checkout ───
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─── 2. Python ───
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # ─── 3. Зависимости ───
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ─── 4. Кэш обогащений ───
      - name: Restore enrichment cache
        uses: actions/cache@v4
        with:
          path: _cache
          key: enrichment-${{ github.ref }}-${{ hashFiles('_content/*.json') }}
          restore-keys: |
            enrichment-${{ github.ref }}-
            enrichment-

      - name: Ensure cache dir exists
        run: mkdir -p _cache

      # ─── 5. Основной скрипт ───
      - name: Run update_content_json.py
        id: sync
        env:
          # GitHub Releases
          STORAGE_OWNER:              ${{ secrets.STORAGE_OWNER || 'DimonMaxx' }}
          STORAGE_REPO:               ${{ secrets.STORAGE_REPO  || 'files' }}
          STORAGE_TOKEN:              ${{ secrets.STORAGE_TOKEN }}
          RELEASE_PROXY_BASE:         ${{ secrets.RELEASE_PROXY_BASE || 'https://gh-release-proxy.macsimenkodima.workers.dev' }}

          # Google Sheets
          GOOGLE_CREDENTIALS_JSON:    ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID:             ${{ secrets.SPREADSHEET_ID }}
          SPREADSHEET_NAME:           "НаполнениеСайта"

          # Supabase
          SUPABASE_URL:               "https://rmoonebbvpmvthvpcmpt.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          # Сайт
          SITE_BASE_URL:              "https://dimonmaxx.github.io"
          GOOGLE_BOOKS_API_KEY:       ${{ secrets.GOOGLE_BOOKS_API_KEY }}

          # Флаги поведения
          PRESERVE_USER_EDITS:        "1"
          BACKUP_BEFORE_SYNC:         "1"
          BACKUP_KEEP_COUNT:          "3"
          MIN_DESCRIPTION_LENGTH:     "20"
          ENRICH_BOOKS:               "0"
          PARSE_FILE_DESCRIPTIONS:    "0"

          # Telegram
          TELEGRAM_BOT_TOKEN:         ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:           ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # ─── Перевод выбора режима ───
          MODE_INPUT="${{ github.event.inputs.mode }}"
          case "$MODE_INPUT" in
            "Полная синхронизация (GitHub + Sheets + JSON)") MODE="all" ;;
            "Только GitHub -> Google Sheets (Сбор файлов)") MODE="repo-to-sheets" ;;
            "Только Google Sheets -> JSON (Обновление сайта)") MODE="sheets-to-json" ;;
            "Только отчет (Ничего не менять)") MODE="report-only" ;;
            *) MODE="all" ;;
          esac

          # ─── Сбор выбранных разделов из чекбоксов ───
          SYNC_SECTIONS=""
          # Проверяем, что запуск ручной (чтобы при авто-запуске по расписанию работали все разделы)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.sync_books }}" = "true" ]; then SYNC_SECTIONS="${SYNC_SECTIONS}books,"; fi
            if [ "${{ github.event.inputs.sync_programs }}" = "true" ]; then SYNC_SECTIONS="${SYNC_SECTIONS}programs,"; fi
            if [ "${{ github.event.inputs.sync_music }}" = "true" ]; then SYNC_SECTIONS="${SYNC_SECTIONS}music,"; fi
            if [ "${{ github.event.inputs.sync_games }}" = "true" ]; then SYNC_SECTIONS="${SYNC_SECTIONS}games,"; fi
            if [ "${{ github.event.inputs.sync_movies }}" = "true" ]; then SYNC_SECTIONS="${SYNC_SECTIONS}movies,"; fi
            if [ "${{ github.event.inputs.sync_misc }}" = "true" ]; then SYNC_SECTIONS="${SYNC_SECTIONS}misc,"; fi
            if [ "${{ github.event.inputs.sync_articles }}" = "true" ]; then SYNC_SECTIONS="${SYNC_SECTIONS}articles,"; fi
            if [ "${{ github.event.inputs.sync_news }}" = "true" ]; then SYNC_SECTIONS="${SYNC_SECTIONS}news,"; fi
            
            # Убираем лишнюю запятую в конце
            SYNC_SECTIONS=${SYNC_SECTIONS%,}
            
            # Если пользователь снял все галочки, делаем предупреждение, но запускаем все (или можно прервать)
            if [ -z "$SYNC_SECTIONS" ]; then
              echo "ВНИМАНИЕ: Не выбран ни один раздел. Будут обновлены ВСЕ разделы."
              SYNC_SECTIONS=""
            fi
          fi

          # ─── Формирование аргументов ───
          DRY="${{ github.event.inputs.dry_run }}"
          ARGS="--mode=$MODE --repo-dir=."

          if [ "$DRY" = "true" ]; then
            echo "=== DRY-RUN режим ==="
            ARGS="$ARGS --dry-run"
          else
            echo "=== IN-PLACE режим (запись в Sheets и JSON) ==="
            ARGS="$ARGS --in-place"
          fi

          if [ -n "$SYNC_SECTIONS" ]; then
            echo "Выбранные разделы: $SYNC_SECTIONS"
            ARGS="$ARGS --sections=$SYNC_SECTIONS"
          else
            echo "Разделы: ВСЕ"
          fi

          echo "Запуск: python update_content_json.py $ARGS"
          python update_content_json.py $ARGS

      # ─── 6. Commit & push ───
      - name: Commit and push changes
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add _content/ || true
          git add sitemap.xml || true
          git add _reports/ || true
          if [ -d _cache ]; then
            git add _cache/ || true
          fi

          if git diff --staged --quiet; then
            echo "Нет изменений для коммита."
            exit 0
          fi

          git commit -m "Auto-sync content $(date -u +'%Y-%m-%d %H:%M UTC')"

          git pull --rebase origin main || {
            echo "Rebase conflict — оставляем свежую генерацию"
            git checkout --theirs _content/ 2>/dev/null || true
            git add _content/ || true
            git add sitemap.xml || true
            git add _reports/ || true
            GIT_EDITOR=true git rebase --continue || git rebase --skip || true
          }

          git push

      # ─── 7. Upload отчёта ───
      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-report-${{ github.run_id }}
          path: |
            _reports/*.json
          retention-days: 14
          if-no-files-found: ignore

      # ─── 8. Telegram on failure ───
      - name: Notify Telegram on failure
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "cancelled" ]; then EMOJI="⚠️"; else EMOJI="❌"; fi
          TEXT="$EMOJI Sync content — $STATUS
          Запуск: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="$TEXT" \
            -d disable_web_page_preview=true \
            > /dev/null || true