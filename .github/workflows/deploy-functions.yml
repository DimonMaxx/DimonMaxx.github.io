name: Deploy Supabase Functions

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Имя конкретной функции (пусто = все)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Проверка без деплоя (только показать список)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'rmoonebbvpmvthvpcmpt' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Diagnose repository structure
        run: |
          echo "=== Структура репозитория (корень) ==="
          ls -la

          echo ""
          echo "=== Папка supabase/ ==="
          if [ -d "supabase" ]; then
            ls -la supabase/ || true
          else
            echo "  [!] Папки supabase/ нет в корне"
          fi

          echo ""
          echo "=== Папка supabase/functions/ ==="
          if [ -d "supabase/functions" ]; then
            ls -la supabase/functions/ || true
          else
            echo "  [!] Папки supabase/functions/ нет"
            echo "  Подсказка: возможно, функции лежат в другой папке (functions/, edge-functions/ и т.п.)"
            echo ""
            echo "  Поиск index.ts по всему репозиторию:"
            find . -name "index.ts" -not -path "./node_modules/*" -not -path "./.git/*" || true
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 1.200.3

      - name: Verify Supabase CLI
        run: |
          supabase --version
          echo "Project ref: ${SUPABASE_PROJECT_REF}"

      - name: List Edge Functions in repository
        id: list_functions
        run: |
          set -e

          if [ ! -d "supabase/functions" ]; then
            echo "::error::Папка supabase/functions/ не найдена в репозитории."
            echo "::error::Убедитесь, что функции закоммичены в git в правильную папку."
            exit 1
          fi

          echo "=== Найденные Edge Functions ==="
          FUNCS=""
          ANY_DIR=0

          for dir in supabase/functions/*/; do
            # Если glob не сработал — dir = "supabase/functions/*/"
            if [ ! -d "$dir" ]; then
              continue
            fi
            ANY_DIR=1

            name=$(basename "$dir")
            if [ "$name" = "_shared" ]; then
              echo "  [skip] $name (служебная)"
              continue
            fi

            if [ -f "${dir}index.ts" ]; then
              echo "  [ok]   $name"
              FUNCS="$FUNCS $name"
            else
              echo "  [skip] $name (нет index.ts)"
              echo "         Содержимое папки:"
              ls -la "$dir" || true
            fi
          done

          if [ "$ANY_DIR" = "0" ]; then
            echo "::error::Папка supabase/functions/ существует, но в ней нет подпапок."
            echo "::error::Ожидается структура: supabase/functions/<имя>/index.ts"
            echo ""
            echo "Содержимое supabase/functions/:"
            ls -la supabase/functions/ || true
            exit 1
          fi

          FUNCS=$(echo "$FUNCS" | xargs)

          if [ -z "$FUNCS" ]; then
            echo "::error::Не найдено ни одной функции с index.ts"
            exit 1
          fi

          echo ""
          echo "Итоговый список: $FUNCS"
          echo "functions=$FUNCS" >> "$GITHUB_OUTPUT"

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::Секрет SUPABASE_ACCESS_TOKEN не задан."
            exit 1
          fi
          supabase projects list > /dev/null
          echo "✓ Авторизация Supabase CLI прошла успешно."

      - name: Deploy functions
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          FUNCS="${{ steps.list_functions.outputs.functions }}"
          ONE="${{ github.event.inputs.function_name }}"

          if [ -n "$ONE" ]; then
            FUNCS="$ONE"
            echo "=== Деплой только одной функции: $ONE ==="
          else
            echo "=== Деплой всех функций ==="
          fi

          DEPLOYED=0
          FAILED=0
          for fn in $FUNCS; do
            echo ""
            echo "────────────  Deploy: $fn  ────────────"
            if supabase functions deploy "$fn" \
                 --project-ref "${SUPABASE_PROJECT_REF}" 2>&1; then
              echo "✓ $fn задеплоена"
              DEPLOYED=$((DEPLOYED + 1))
            else
              echo "✗ $fn — ошибка"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "════════════════════════════════════════"
          echo "  Задеплоено: $DEPLOYED"
          echo "  Ошибок:     $FAILED"
          echo "════════════════════════════════════════"

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED функций не задеплоились"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Deploy Supabase Functions"
            echo ""
            echo "- Project ref: \`${SUPABASE_PROJECT_REF}\`"
            echo "- Функции: ${{ steps.list_functions.outputs.functions }}"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "**Статус:** ✅ успех"
            else
              echo "**Статус:** ❌ ошибка"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Telegram on failure
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$([ "$STATUS" = "cancelled" ] && echo "⚠️" || echo "❌")
          TEXT="$EMOJI Deploy Supabase Functions — $STATUS
          Запуск: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="$TEXT" \
            -d disable_web_page_preview=true \
            > /dev/null || true
