name: Deploy Supabase Functions

on:
  # Автозапуск при изменениях в Edge Functions
  push:
    branches: [ main ]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'

  # Ручной запуск из интерфейса GitHub
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Имя конкретной функции (пусто = все)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Проверка без деплоя (только показать список)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Не запускать два деплоя одновременно
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Project ref Supabase. Хардкод — на случай, если секрет не задан.
      # Формат: <20 символов без домена> — часть до ".supabase.co"
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'rmoonebbvpmvthvpcmpt' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Стабильная версия, проверенная на совместимость
          version: 1.200.3

      - name: Verify Supabase CLI
        run: |
          echo "Supabase CLI version:"
          supabase --version
          echo "Project ref: ${SUPABASE_PROJECT_REF}"

      - name: List Edge Functions in repository
        id: list_functions
        run: |
          echo "=== Найденные Edge Functions ==="
          FUNCS=""
          for dir in supabase/functions/*/; do
            # Пропускаем служебную папку _shared
            name=$(basename "$dir")
            if [ "$name" = "_shared" ]; then
              echo "  [skip] $name (служебная)"
              continue
            fi
            # Функция — это папка с index.ts
            if [ -f "${dir}index.ts" ]; then
              echo "  [ok]   $name"
              FUNCS="$FUNCS $name"
            else
              echo "  [skip] $name (нет index.ts)"
            fi
          done
          FUNCS=$(echo "$FUNCS" | xargs)  # trim
          echo "functions=$FUNCS" >> "$GITHUB_OUTPUT"
          if [ -z "$FUNCS" ]; then
            echo "::error::Не найдено ни одной функции с index.ts"
            exit 1
          fi

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::Секрет SUPABASE_ACCESS_TOKEN не задан в настройках репозитория."
            echo "Инструкция: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          # Проверка авторизации и привязка к проекту
          supabase projects list > /dev/null
          echo "✓ Авторизация Supabase CLI прошла успешно."

      - name: Deploy functions
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          FUNCS="${{ steps.list_functions.outputs.functions }}"
          ONE="${{ github.event.inputs.function_name }}"

          if [ -n "$ONE" ]; then
            FUNCS="$ONE"
            echo "=== Деплой только одной функции: $ONE ==="
          else
            echo "=== Деплой всех функций ==="
          fi

          DEPLOYED=0
          FAILED=0
          for fn in $FUNCS; do
            echo ""
            echo "────────────  Deploy: $fn  ────────────"
            if supabase functions deploy "$fn" \
                 --project-ref "${SUPABASE_PROJECT_REF}" \
                 --no-verify-jwt=false 2>&1; then
              echo "✓ $fn задеплоена"
              DEPLOYED=$((DEPLOYED + 1))
            else
              echo "✗ $fn — ошибка"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "════════════════════════════════════════"
          echo "  Задеплоено: $DEPLOYED"
          echo "  Ошибок:     $FAILED"
          echo "════════════════════════════════════════"

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED функций не задеплоились"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Deploy Supabase Functions"
            echo ""
            echo "- Project ref: \`${SUPABASE_PROJECT_REF}\`"
            echo "- Функции:"
            for fn in ${{ steps.list_functions.outputs.functions }}; do
              echo "  - \`$fn\`"
            done
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "**Статус:** ✅ успех"
            else
              echo "**Статус:** ❌ ошибка"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Telegram on failure
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "cancelled" ]; then
            EMOJI="⚠️"
          else
            EMOJI="❌"
          fi

          TEXT="$EMOJI Deploy Supabase Functions — $STATUS"
          TEXT="$TEXT
          Запуск: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="$TEXT" \
            -d disable_web_page_preview=true \
            > /dev/null || true

      - name: Notify Telegram on success
        if: success() && github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TEXT="✅ Deploy Supabase Functions — успех
          Запуск: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="$TEXT" \
            -d disable_web_page_preview=true \
            > /dev/null || true
