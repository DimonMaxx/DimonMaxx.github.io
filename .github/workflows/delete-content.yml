name: Delete content

on:
  workflow_dispatch:
    inputs:
      delete_list:
        description: 'JSON-список удаляемых записей'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sync-content
  cancel-in-progress: false

jobs:
  delete-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth google-auth-httplib2 pandas requests supabase

      - name: Delete from Google Sheets
        env:
          GOOGLE_CREDENTIALS_JSON:   ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID:            ${{ secrets.SPREADSHEET_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DELETE_LIST:               ${{ github.event.inputs.delete_list }}
          TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:          ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python delete_content.py

      - name: Regenerate JSON
        env:
          GOOGLE_CREDENTIALS_JSON:   ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID:            ${{ secrets.SPREADSHEET_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_BASE_URL:             "https://dimonmaxx.github.io/my-site"
        run: python generate_from_sheets.py

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add _content/ || true
          git add sitemap.xml || true

          if git diff --staged --quiet; then
            echo "Нет изменений для коммита."
            exit 0
          fi

          git commit -m "Удаление контента через админ-панель [skip ci]"

          git pull --rebase origin main || {
            echo "Rebase conflict — оставляем свежую генерацию"
            git checkout --theirs _content/ 2>/dev/null || true
            git add _content/ || true
            git add sitemap.xml || true
            GIT_EDITOR=true git rebase --continue || git rebase --skip || true
          }

          git push

      - name: Notify Telegram on failure
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "cancelled" ]; then
            EMOJI="⚠️"
          else
            EMOJI="❌"
          fi

          TEXT="$EMOJI Delete content — $STATUS"
          TEXT="$TEXT
          Запуск: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="$TEXT" \
            -d disable_web_page_preview=true \
            > /dev/null || true
